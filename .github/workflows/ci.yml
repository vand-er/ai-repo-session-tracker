name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python }}

      # The tracer bullet: the package installs the way a stranger installs it, and the command runs.
      - name: Install the package with pipx
        run: pipx install --python "${{ steps.py.outputs.python-path }}" .

      # `--help` loads no GUI code, so it runs without a display, even on Linux.
      - name: Run the installed command
        run: wayfinder-board --help

      - name: Install the package for the tests
        run: python -m pip install -e .

      - name: Run the suite
        if: runner.os != 'Linux'
        run: python -m unittest discover -v

      - name: Run the suite under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -v
